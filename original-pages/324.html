<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第10章　京东集团华东数据中心 · 书页 310 · PDF 324 · 原文</title><link rel="stylesheet" href="../original-text.css"></head><body class="original-standalone"><nav class="original-navigation"><a href="323.html">← PDF 323</a><a href="../index.html#original/324">回到课程阅读器</a><a href="325.html">PDF 325 →</a></nav><p class="original-editorial">PDF第324页 · 已逐页校对</p><article class="original-prose book-faithful book-paper book-chapter-10" id="original-page-content"><header class="book-running-head even"><span>310</span><span class="book-head-ornament"></span><span>京东数据中心构建实战</span></header><p>（5）大屏展示模块功能</p><p>通过该模块可以动态的展示机房内重要设备的关键参数，实时直观地显示各系统设备的运行数据、运行状态、机房内的情况、各子系统相关拓扑图。大屏幕展示模块构成如图10-62所示。</p><figure id="ch10-fig-62" class="book-figure-ch10-62 "><img src="../assets/original-figures/p324-fig10-62.webp" width="1369" height="1179" alt="图10-62　大屏展示模块构成图"><figcaption>图10-62　大屏展示模块构成图</figcaption></figure><p>京东集团华东数据中心是京东技术转型的一个全新尝试。从它目前运营的稳定情况来看无疑是成功的。这是一个可贵的开始，意味着京东厚积薄发的技术实力得到了实践的验证，也为今后京东在数据中心行业的探索和技术创新增强了信心。</p></article><nav class="original-navigation"><a href="323.html">← PDF 323</a><a href="325.html">PDF 325 →</a></nav></body></html>
