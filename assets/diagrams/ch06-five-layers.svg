<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title"><title id="title">五层监控：数据必须走到可验证的行动</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect width="1000" height="520" rx="18" fill="#101c2b"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#e5edf7;font-size:20px}.small{font-size:17px;fill:#a9bdd3}.title{font-size:26px;font-weight:600}.line{fill:none;stroke-width:3;marker-end:url(#arrow)}.cold{stroke:#62c4e8}.hot{stroke:#efa277}.note{fill:#b7c8d9;font-size:18px}</style><text class="title" x="38" y="48">五层监控：数据必须走到可验证的行动</text><rect x="160" y="100" width="640" height="54" rx="8" fill="#182b40" stroke="#426a84"/><text x="180" y="134" class="">5 系统应用</text><text x="420" y="134" class="small">告警、责任、工单、容量与能效</text><rect x="160" y="170" width="640" height="54" rx="8" fill="#182b40" stroke="#426a84"/><text x="180" y="204" class="">4 可视化展示</text><text x="420" y="204" class="small">ECC：位置、影响、证据与处理状态</text><rect x="160" y="240" width="640" height="54" rx="8" fill="#182b40" stroke="#426a84"/><text x="180" y="274" class="">3 设备管理</text><text x="420" y="274" class="small">主机、存储、网关、控制器与缓存</text><rect x="160" y="310" width="640" height="54" rx="8" fill="#182b40" stroke="#426a84"/><text x="180" y="344" class="">2 传输网络</text><text x="420" y="344" class="small">总线 / 以太网、转换、冗余与质量</text><rect x="160" y="380" width="640" height="54" rx="8" fill="#182b40" stroke="#426a84"/><text x="180" y="414" class="">1 前端采集</text><text x="420" y="414" class="small">温度、流量、功率、状态、时间戳</text><path d="M115 420 L115 112" class="line" stroke="#62c4e8"/><text x="30" y="280" class="">数据</text><path d="M850 115 L850 420" class="line" stroke="#efa277"/><text x="870" y="270" class="">授权</text><text x="870" y="300" class="">控制</text><text x="40" y="490" class="note">每层问：来源可信？链路可用？失效可见？动作有责任与反馈？</text></svg>