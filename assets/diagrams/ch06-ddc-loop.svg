<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title"><title id="title">控制闭环：命令发出，不等于设备已执行</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect width="1000" height="520" rx="18" fill="#101c2b"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#e5edf7;font-size:20px}.small{font-size:17px;fill:#a9bdd3}.title{font-size:26px;font-weight:600}.line{fill:none;stroke-width:3;marker-end:url(#arrow)}.cold{stroke:#62c4e8}.hot{stroke:#efa277}.note{fill:#b7c8d9;font-size:18px}</style><text class="title" x="38" y="48">控制闭环：命令发出，不等于设备已执行</text><rect x="55" y="190" width="190" height="90" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="73" y="223" class="">现场传感器</text><text x="73" y="252" class="small">AI / DI 输入</text><rect x="340" y="190" width="210" height="90" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="358" y="223" class="">DDC 逻辑</text><text x="358" y="252" class="small">条件、联锁、调节</text><rect x="650" y="190" width="220" height="90" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="668" y="223" class="">执行器 / 设备</text><text x="668" y="252" class="small">AO / DO 输出</text><path d="M250 235 L335 235" class="line" stroke="#62c4e8"/><path d="M555 235 L645 235" class="line" stroke="#efa277"/><path d="M760 285 L760 390 L150 390 L150 285" class="line" stroke="#9ad6b0"/><text x="355" y="365" class="note">状态与物理效果反馈</text><rect x="340" y="75" width="210" height="70" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="358" y="108" class="">上层工作站</text><text x="358" y="137" class="small">分析与授权设定</text><path d="M445 150 L445 185" class="line" stroke="#efa277" stroke-dasharray="8 6"/><text x="40" y="465" class="note">阀位反馈、流量及温差共同核验动作；网络中断时的本地行为要预先定义。</text></svg>