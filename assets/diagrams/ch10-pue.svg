<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="565" viewBox="0 0 1000 565" role="img" aria-label="PUE：先画计量边界，再计算比例"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#356b65"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172e38;font-size:18px}.small{font-size:15px;fill:#4e6670}.box{fill:#fff;stroke:#a9c5c0;stroke-width:2}.line{fill:none;stroke:#356b65;stroke-width:2.5;marker-end:url(#a)}.thin{fill:none;stroke:#87a79f;stroke-width:2}.warm{fill:#fff0d9;stroke:#caa970;stroke-width:2}</style><rect width="1000" height="565" rx="20" fill="#f3f7f5"/><text x="34" y="42" font-size="25" font-weight="700">PUE：先画计量边界，再计算比例</text><rect x="30" y="100" width="170" height="84" rx="10" class="box"/><text x="115.0" y="130" text-anchor="middle">市电</text><text x="115.0" y="155" text-anchor="middle">M1：E1</text><rect x="30" y="260" width="170" height="84" rx="10" class="box"/><text x="115.0" y="290" text-anchor="middle">柴油发电</text><text x="115.0" y="315" text-anchor="middle">M2：E2</text><rect x="300" y="180" width="180" height="84" rx="10" class="box"/><text x="390.0" y="210" text-anchor="middle">数据中心输入</text><text x="390.0" y="235" text-anchor="middle">E1+E2</text><rect x="660" y="80" width="270" height="84" rx="10" class="box"/><text x="795.0" y="110" text-anchor="middle">UPS后IT路径</text><text x="795.0" y="135" text-anchor="middle">M3：E3</text><rect x="660" y="220" width="270" height="84" rx="10" class="box"/><text x="795.0" y="250" text-anchor="middle">制冷 / 照明等</text><text x="795.0" y="275" text-anchor="middle">包含在数据中心分子</text><rect x="660" y="360" width="270" height="84" rx="10" class="box"/><text x="795.0" y="390" text-anchor="middle">办公用电</text><text x="795.0" y="415" text-anchor="middle">M4：E4，按原图剔除</text><path class="line" d="M200,140 H245 V220 H300"/><path class="line" d="M200,300 H245 V220"/><path class="line" d="M480,220 H570 V122 H660"/><path class="line" d="M570,220 V262 H660"/><path class="line" d="M570,262 V402 H660"/><text x="45" y="465">同周期电量：PUE = (E1 + E2 − E4) / E3</text><text x="45" y="500">分母按案例测点解释，不擅自等同所有IT芯片的净耗能；保留计量边界。</text><text x="34" y="541" class="small">依据图10-49重绘，课程用E表示电量以避免与功率混淆。</text></svg>