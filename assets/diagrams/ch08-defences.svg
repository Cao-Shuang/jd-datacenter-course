<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="消防：把风险链与保护链放在一起看"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#356b65"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172e38;font-size:18px}.small{font-size:15px;fill:#4e6670}.box{fill:#fff;stroke:#a9c5c0;stroke-width:2}.line{fill:none;stroke:#356b65;stroke-width:2.5;marker-end:url(#a)}.thin{fill:none;stroke:#87a79f;stroke-width:2}.warm{fill:#fff0d9;stroke:#caa970;stroke-width:2}</style><rect width="1000" height="500" rx="20" fill="#f3f7f5"/><text x="34" y="42" font-size="25" font-weight="700">消防：把风险链与保护链放在一起看</text><rect x="35" y="100" width="180" height="84" rx="10" class="box"/><text x="125.0" y="130" text-anchor="middle">风险源</text><text x="125.0" y="155" text-anchor="middle">负荷 / 接点 / 材料</text><rect x="285" y="100" width="180" height="84" rx="10" class="box"/><text x="375.0" y="130" text-anchor="middle">早期异常</text><text x="375.0" y="155" text-anchor="middle">温升 / 烟 / 故障</text><rect x="535" y="100" width="180" height="84" rx="10" class="box"/><text x="625.0" y="130" text-anchor="middle">火灾发展</text><text x="625.0" y="155" text-anchor="middle">分隔与限制蔓延</text><rect x="785" y="100" width="180" height="84" rx="10" class="box"/><text x="875.0" y="130" text-anchor="middle">人员与服务</text><text x="875.0" y="155" text-anchor="middle">疏散 / 保护 / 恢复</text><path class="line" d="M215,140 H285"/><path class="line" d="M465,140 H535"/><path class="line" d="M715,140 H785"/><rect x="35" y="270" width="180" height="84" rx="10" class="box"/><text x="125.0" y="300" text-anchor="middle">设计与预防</text><text x="125.0" y="325" text-anchor="middle">减少产生风险</text><rect x="285" y="270" width="180" height="84" rx="10" class="box"/><text x="375.0" y="300" text-anchor="middle">探测与报警</text><text x="375.0" y="325" text-anchor="middle">及时形成可靠信息</text><rect x="535" y="270" width="180" height="84" rx="10" class="box"/><text x="625.0" y="300" text-anchor="middle">围护与灭火系统</text><text x="625.0" y="325" text-anchor="middle">按适用条件保护</text><rect x="785" y="270" width="180" height="84" rx="10" class="box"/><text x="875.0" y="300" text-anchor="middle">流程与记录</text><text x="875.0" y="325" text-anchor="middle">明确责任和复盘</text><path class="thin" d="M125,270 V184"/><path class="thin" d="M375,270 V184"/><path class="thin" d="M625,270 V184"/><path class="thin" d="M875,270 V184"/><text x="40" y="430">不同防线承担不同任务；共同电源、维护缺失或错误变更可能同时削弱多道防线。</text><text x="34" y="476" class="small">依据第 8 章课程归纳；箭头表示因果关系，非火灾现场处置步骤。</text></svg>