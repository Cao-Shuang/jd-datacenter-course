<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title"><title id="title">冷量供应的反面，是一条完整排热路径</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect width="1000" height="520" rx="18" fill="#101c2b"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#e5edf7;font-size:20px}.small{font-size:17px;fill:#a9bdd3}.title{font-size:26px;font-weight:600}.line{fill:none;stroke-width:3;marker-end:url(#arrow)}.cold{stroke:#62c4e8}.hot{stroke:#efa277}.note{fill:#b7c8d9;font-size:18px}</style><text class="title" x="38" y="48">冷量供应的反面，是一条完整排热路径</text><rect x="35" y="140" width="190" height="90" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="53" y="173" class="">机柜 / 空气</text><text x="53" y="202" class="small">IT 热量</text><rect x="280" y="140" width="190" height="90" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="298" y="173" class="">末端盘管</text><text x="298" y="202" class="small">空气 → 冷冻水</text><rect x="535" y="140" width="190" height="90" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="553" y="173" class="">冷水机组</text><text x="553" y="202" class="small">另加压缩机功</text><rect x="790" y="140" width="175" height="90" rx="10" fill="#182b40" stroke="#efa277" stroke-width="2"/><text x="808" y="173" class="">冷却塔</text><text x="808" y="202" class="small">向环境排热</text><path d="M230 185 L275 185" class="line" stroke="#62c4e8"/><path d="M475 185 L530 185" class="line" stroke="#62c4e8"/><path d="M730 185 L785 185" class="line" stroke="#efa277"/><path d="M380 240 L380 295 L620 295 L620 240" class="line" stroke="#62c4e8"/><text x="427" y="325" class="small">冷冻水回路</text><path d="M645 240 L645 365 L875 365 L875 240" class="line" stroke="#efa277"/><text x="710" y="395" class="small">冷却水回路</text><rect x="55" y="350" width="270" height="85" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="73" y="383" class="">蓄冷：储存短时热容量</text><text x="73" y="412" class="small">仍需可用泵、阀与末端</text><path d="M325 385 L350 385 L350 250" class="line" stroke="#9ad6b0" stroke-dasharray="8 6"/><text x="40" y="100" class="small">上方箭头表示热量方向，下方回路表示不同水系统；并非施工接管图。</text><text x="40" y="480" class="note">自然冷却可由环境经换热器提供路径，须核对温差、流量与控制条件。</text></svg>