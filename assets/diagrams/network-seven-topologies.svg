<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 875" role="img" aria-labelledby="title desc">
<title id="title">七种网络拓扑：观察节点与连接关系</title><desc id="desc">根据原书图7-1重绘。环、部分网状、树、星、全连通、线和总线。重绘说明连接结构，不表示协议、容量或切换保障。</desc>
<rect width="1080" height="875" fill="#f7f6f0"/>
<style>text{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#243c32}.title{font-size:21px;font-weight:700}.name{font-size:19px;font-weight:700}.note{font-size:15px;fill:#52645b}.edge{stroke:#647f70;stroke-width:3;fill:none}.node{fill:#243f32;stroke:#f7f6f0;stroke-width:2}</style>
<text x="30" y="38" class="title">先读连接，再判断故障影响</text><text x="30" y="66" class="note">原书图 7-1 的结构重绘 · 线表示连接，不自动证明切换成功或带宽足够</text>
<g transform="translate(25 95)"><rect width="330" height="245" rx="12" fill="#fff" stroke="#d3dcd2"/><text x="20" y="30" class="name">环形</text><g transform="translate(30 40)">
<line class="edge" x1="194.00" y1="88.00" x2="162.00" y2="143.43"/>
<line class="edge" x1="162.00" y1="143.43" x2="98.00" y2="143.43"/>
<line class="edge" x1="98.00" y1="143.43" x2="66.00" y2="88.00"/>
<line class="edge" x1="66.00" y1="88.00" x2="98.00" y2="32.57"/>
