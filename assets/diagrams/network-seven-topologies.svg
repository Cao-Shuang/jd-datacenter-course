</g><text x="18" y="225" class="note">任意两个节点之间都有直接连接。</text></g>
<g transform="translate(725 355)"><rect width="330" height="245" rx="12" fill="#fff" stroke="#d3dcd2"/><text x="20" y="30" class="name">线形</text><g transform="translate(30 40)">
<line class="edge" x1="22.00" y1="90.00" x2="66.00" y2="90.00"/>
