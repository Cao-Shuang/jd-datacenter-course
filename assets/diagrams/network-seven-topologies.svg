<circle class="node" cx="170.00" cy="150.62" r="10"/>
<circle class="node" cx="100.00" cy="150.62" r="10"/>
<circle class="node" cx="65.00" cy="90.00" r="10"/>
<circle class="node" cx="100.00" cy="29.38" r="10"/>
<circle class="node" cx="170.00" cy="29.38" r="10"/>
</g><text x="18" y="225" class="note">外部连接分开，中心仍是共同节点。</text></g>
<g transform="translate(375 355)"><rect width="330" height="245" rx="12" fill="#fff" stroke="#d3dcd2"/><text x="20" y="30" class="name">全连通网状</text><g transform="translate(30 40)">
