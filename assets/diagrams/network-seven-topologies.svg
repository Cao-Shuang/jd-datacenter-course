<g transform="translate(25 615)"><rect width="680" height="230" rx="12" fill="#fff" stroke="#d3dcd2"/><text x="20" y="32" class="name">总线形</text><path class="edge" d="M50 116H630"/>
<path class="edge" d="M90 116V73"/><circle class="node" cx="90" cy="73" r="10"/>
<path class="edge" d="M185 116V163"/><circle class="node" cx="185" cy="163" r="10"/>
<path class="edge" d="M280 116V73"/><circle class="node" cx="280" cy="73" r="10"/>
<path class="edge" d="M375 116V163"/><circle class="node" cx="375" cy="163" r="10"/>
<path class="edge" d="M470 116V73"/><circle class="node" cx="470" cy="73" r="10"/>
<path class="edge" d="M565 116V163"/><circle class="node" cx="565" cy="163" r="10"/>
<text x="20" y="210" class="note">各节点共享同一主干；分支独立并不消除主干故障。</text></g><g transform="translate(725 615)"><rect width="330" height="230" rx="12" fill="#e8ede3"/><text x="20" y="34" class="name">读图时问三个问题</text><text x="20" y="78" class="note">1. 端点和互连设备分别在哪里？</text><text x="20" y="118" class="note">2. 删除哪条边会使路径断开？</text><text x="20" y="158" class="note">3. 图没有给出哪些运行条件？</text><text x="20" y="203" class="note">连通性 ≠ 容量、协议或自动接替</text></g></svg>