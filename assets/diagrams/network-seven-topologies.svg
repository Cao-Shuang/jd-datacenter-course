<circle class="node" cx="98.00" cy="143.43" r="10"/>
<circle class="node" cx="66.00" cy="88.00" r="10"/>
<circle class="node" cx="98.00" cy="32.57" r="10"/>
<circle class="node" cx="162.00" cy="32.57" r="10"/>
</g><text x="18" y="225" class="note">任一连接断开后，环成为一条链。</text></g>
<g transform="translate(375 95)"><rect width="330" height="245" rx="12" fill="#fff" stroke="#d3dcd2"/><text x="20" y="30" class="name">部分网状</text><g transform="translate(30 40)">
<line class="edge" x1="50.00" y1="30.00" x2="115.00" y2="30.00"/>
<line class="edge" x1="50.00" y1="30.00" x2="50.00" y2="95.00"/>
