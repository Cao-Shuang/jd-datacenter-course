<circle class="node" cx="235.00" cy="38.00" r="10"/>
</g><text x="18" y="225" class="note">分支节点退出，会切断它连接的支路。</text></g>
<g transform="translate(25 355)"><rect width="330" height="245" rx="12" fill="#fff" stroke="#d3dcd2"/><text x="20" y="30" class="name">星形</text><g transform="translate(30 40)">
<line class="edge" x1="135.00" y1="90.00" x2="205.00" y2="90.00"/>
