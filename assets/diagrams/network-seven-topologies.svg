<circle class="node" cx="235.00" cy="145.00" r="10"/>
</g><text x="18" y="225" class="note">有多条连接，不保证每个节点都冗余。</text></g>
<g transform="translate(725 95)"><rect width="330" height="245" rx="12" fill="#fff" stroke="#d3dcd2"/><text x="20" y="30" class="name">树形</text><g transform="translate(30 40)">
<line class="edge" x1="135.00" y1="145.00" x2="75.00" y2="95.00"/>
<line class="edge" x1="135.00" y1="145.00" x2="190.00" y2="95.00"/>
