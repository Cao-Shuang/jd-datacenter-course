<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="光链路：算清每一处损耗"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#356b65"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172e38;font-size:18px}.small{font-size:15px;fill:#4e6670}.box{fill:#fff;stroke:#a9c5c0;stroke-width:2}.line{fill:none;stroke:#356b65;stroke-width:2.5;marker-end:url(#a)}.thin{fill:none;stroke:#87a79f;stroke-width:2}.warm{fill:#fff0d9;stroke:#caa970;stroke-width:2}</style><rect width="1000" height="400" rx="20" fill="#f3f7f5"/><text x="34" y="42" font-size="25" font-weight="700">光链路：算清每一处损耗</text><rect x="35" y="105" width="150" height="84" rx="10" class="box"/><text x="110.0" y="135" text-anchor="middle">发射端</text><text x="110.0" y="160" text-anchor="middle">应用损耗预算 B</text><rect x="280" y="105" width="150" height="84" rx="10" class="box"/><text x="355.0" y="135" text-anchor="middle">连接 / 熔接</text><text x="355.0" y="160" text-anchor="middle">各处都消耗余量</text><rect x="600" y="105" width="150" height="84" rx="10" class="box"/><text x="675.0" y="135" text-anchor="middle">光纤 α×L</text><text x="675.0" y="160" text-anchor="middle">长度以 km 计</text><rect x="820" y="105" width="150" height="84" rx="10" class="box"/><text x="895.0" y="135" text-anchor="middle">接收端</text><text x="895.0" y="160" text-anchor="middle">保留设计裕量</text><path class="line" d="M185,145 H280"/><path class="line" d="M430,145 H600"/><path class="line" d="M750,145 H820"/><text x="70" y="270">器件估算损耗 1.8 dB + 教学设计裕量 0.5 dB = 2.3 dB</text><text x="70" y="315">应用预算 2.6 dB → 剩余 0.3 dB；估算通过仍需一致模型的实测。</text><text x="34" y="376" class="small">所有数字均为课堂假设；实际值需查对应介质、连接器、光模块和测试规则。</text></svg>