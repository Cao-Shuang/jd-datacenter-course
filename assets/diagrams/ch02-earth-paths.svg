<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="t d"><title id="t">TN与TT概念故障回路</title><desc id="d">TN通过金属保护导体返回源；TT经保护接地极、大地和源接地极返回。箭头表示故障路径。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#a76d36"/></marker></defs><rect width="960" height="510" rx="18" fill="#f5f4ef"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203c36"><text x="30" y="40" font-size="25" font-weight="700">电流需要闭合回路，大地不是“消失点”</text><g fill="#e3ede6" stroke="#497568" stroke-width="2"><rect x="40" y="95" width="150" height="95" rx="9"/><rect x="720" y="95" width="190" height="95" rx="9"/><rect x="40" y="320" width="150" height="95" rx="9"/><rect x="720" y="320" width="190" height="95" rx="9"/></g><g font-size="22" text-anchor="middle"><text x="115" y="138">电源</text><text x="115" y="170">中性点</text><text x="815" y="137">设备外壳</text><text x="815" y="170">相线碰壳</text><text x="115" y="363">电源</text><text x="115" y="395">中性点</text><text x="815" y="362">设备外壳</text><text x="815" y="395">相线碰壳</text></g><g stroke="#a76d36" fill="none" stroke-width="3" marker-end="url(#a)"><path d="M190 120H720"/><path d="M815 190V230H115V190"/><path d="M190 345H720"/><path d="M815 415V460H115V415"/></g><g font-size="20"><text x="300" y="108">相线 → 故障点</text><text x="290" y="220">TN：沿 PE 金属通路返回</text><text x="300" y="333">相线 → 故障点</text><text x="305" y="450">TT：经接地极与大地返回</text><text x="30" y="285" font-weight="700">相似的外壳故障，不同的回路阻抗与保护条件</text><text x="30" y="495" font-size="17">教学简图省略正常中性线、其他相线与器件；不能据此实施接线。</text></g><g stroke="#497568" stroke-width="3"><path d="M780 460H850M790 469H840M800 478H830M80 460H150M90 469H140M100 478H130"/></g></g></svg>
