<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1060" viewBox="0 0 960 1060" role="img" aria-label="六种UPS配置的功能路径和共用点"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#386454"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#233f35}.title{font-size:26px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:16px}.note{font-size:15px;fill:#52685e}.box{fill:#fff;stroke:#6b8c7c;stroke-width:1.5}.line{fill:none;stroke:#386454;stroke-width:2.5;marker-end:url(#a)}</style><rect width="100%" height="100%" fill="#f4f7f5"/><text x="28" y="42" class="title" text-anchor="start">六种配置：冗余在哪里，公共点在哪里？</text><text x="28" y="71" class="note" text-anchor="start">图中箭头表示功能供电关系；绿色为UPS路径，浅橙色标出旁路/切换环节。</text><rect x="24" y="96" width="440" height="280" rx="12" fill="#eaf0ec" stroke="#c3d3c9"/><text x="42" y="126" class="label" text-anchor="start">1  单台双变换</text><rect x="42" y="160" width="100" height="42" rx="8" class="box"/><text x="92" y="187" class="small" text-anchor="middle">主路</text><rect x="185" y="160" width="100" height="42" rx="8" class="box"/><text x="235" y="187" class="small" text-anchor="middle">UPS</text><rect x="328" y="226" width="112" height="42" rx="8" class="box"/><text x="384" y="253" class="small" text-anchor="middle">负载</text><path d="M142 181L182 181" class="line"/><path d="M285 181H309V247H324" class="line"/><rect x="42" y="256" width="100" height="42" rx="8" class="box" style="fill:#fff0df"/><text x="92" y="283" class="small" text-anchor="middle">旁路</text><rect x="185" y="256" width="100" height="42" rx="8" class="box" style="fill:#fff0df"/><text x="235" y="283" class="small" text-anchor="middle">旁路开关</text><path d="M142 277L182 277" class="line"/><path d="M285 277H309V247H324" class="line"/><text x="42" y="339" class="note" text-anchor="start">检查：旁路质量、共用输出及维修边界。</text><rect x="496" y="96" width="440" height="280" rx="12" fill="#eaf0ec" stroke="#c3d3c9"/><text x="514" y="126" class="label" text-anchor="start">2  双机冗余 1+1</text><rect x="516" y="154" width="118" height="36" rx="8" class="box"/><text x="575" y="178" class="small" text-anchor="middle">UPS 1</text><path d="M634 172H686" stroke="#386454" stroke-width="2.5" fill="none"/><rect x="516" y="204" width="118" height="36" rx="8" class="box"/><text x="575" y="228" class="small" text-anchor="middle">UPS 2</text><path d="M634 222H686" stroke="#386454" stroke-width="2.5" fill="none"/><path d="M686 172V222" stroke="#386454" stroke-width="3"/><path d="M686 197L736 197" class="line"/><rect x="741" y="176" width="168" height="42" rx="8" class="box"/><text x="825" y="203" class="small" text-anchor="middle">共用母线 → 负载</text><rect x="516" y="312" width="175" height="36" rx="8" class="box" style="fill:#fff0df"/><text x="603.5" y="336" class="small" text-anchor="middle">单台须带全负载</text><text x="705" y="336" class="note" text-anchor="start">公共旁路另核验</text><rect x="24" y="398" width="440" height="280" rx="12" fill="#eaf0ec" stroke="#c3d3c9"/><text x="42" y="428" class="label" text-anchor="start">3  三机冗余 2+1</text><rect x="44" y="456" width="118" height="36" rx="8" class="box"/><text x="103" y="480" class="small" text-anchor="middle">UPS 1</text><path d="M162 474H214" stroke="#386454" stroke-width="2.5" fill="none"/><rect x="44" y="506" width="118" height="36" rx="8" class="box"/><text x="103" y="530" class="small" text-anchor="middle">UPS 2</text><path d="M162 524H214" stroke="#386454" stroke-width="2.5" fill="none"/><rect x="44" y="556" width="118" height="36" rx="8" class="box"/><text x="103" y="580" class="small" text-anchor="middle">UPS 3</text><path d="M162 574H214" stroke="#386454" stroke-width="2.5" fill="none"/><path d="M214 474V574" stroke="#386454" stroke-width="3"/><path d="M214 499L264 499" class="line"/><rect x="269" y="478" width="168" height="42" rx="8" class="box"/><text x="353" y="505" class="small" text-anchor="middle">共用母线 → 负载</text><rect x="44" y="614" width="175" height="36" rx="8" class="box" style="fill:#fff0df"/><text x="131.5" y="638" class="small" text-anchor="middle">剩两台须带全负载</text><text x="233" y="638" class="note" text-anchor="start">公共旁路另核验</text><rect x="496" y="398" width="440" height="280" rx="12" fill="#eaf0ec" stroke="#c3d3c9"/><text x="514" y="428" class="label" text-anchor="start">4  串联热备</text><rect x="514" y="463" width="108" height="40" rx="8" class="box"/><text x="568" y="489" class="small" text-anchor="middle">主路</text><rect x="657" y="463" width="110" height="40" rx="8" class="box"/><text x="712" y="489" class="small" text-anchor="middle">主 UPS</text><rect x="807" y="463" width="110" height="40" rx="8" class="box"/><text x="862" y="489" class="small" text-anchor="middle">负载</text><path d="M622 483L653 483" class="line"/><path d="M767 483L803 483" class="line"/><rect x="514" y="543" width="108" height="40" rx="8" class="box"/><text x="568" y="569" class="small" text-anchor="middle">备用源</text><rect x="657" y="543" width="110" height="40" rx="8" class="box"/><text x="712" y="569" class="small" text-anchor="middle">备用 UPS</text><path d="M622 563L653 563" class="line"/><path d="M712 543V507" class="line"/><text x="779" y="549" class="note" text-anchor="start">接主机旁路</text><text x="514" y="632" class="note" text-anchor="start">检查：转入负载 + 备用机原有负载。</text><rect x="24" y="700" width="440" height="280" rx="12" fill="#eaf0ec" stroke="#c3d3c9"/><text x="42" y="730" class="label" text-anchor="start">5  公共静态旁路柜 SSC</text><rect x="42" y="762" width="140" height="38" rx="8" class="box"/><text x="112" y="787" class="small" text-anchor="middle">UPS 功率组</text><rect x="42" y="835" width="140" height="38" rx="8" class="box" style="fill:#fff0df"/><text x="112" y="860" class="small" text-anchor="middle">公共 SSC</text><rect x="294" y="795" width="150" height="44" rx="8" class="box"/><text x="369" y="823" class="small" text-anchor="middle">共用输出 / 负载</text><path d="M182 781H239V817H291" class="line"/><path d="M182 854H239V817H291" class="line"/><text x="42" y="910" class="note" text-anchor="start">功率单元数量冗余 ≠ 旁路柜独立。</text><text x="42" y="939" class="note" text-anchor="start">检查：SSC容量、控制与维护隔离。</text><rect x="496" y="700" width="440" height="280" rx="12" fill="#eaf0ec" stroke="#c3d3c9"/><text x="514" y="730" class="label" text-anchor="start">6  双路 + STS</text><rect x="514" y="760" width="130" height="38" rx="8" class="box"/><text x="579" y="785" class="small" text-anchor="middle">A 系统 UPS</text><rect x="514" y="828" width="130" height="38" rx="8" class="box"/><text x="579" y="853" class="small" text-anchor="middle">B 系统 UPS</text><rect x="692" y="793" width="82" height="40" rx="8" class="box" style="fill:#fff0df"/><text x="733" y="819" class="small" text-anchor="middle">STS</text><rect x="812" y="793" width="105" height="40" rx="8" class="box"/><text x="864.5" y="819" class="small" text-anchor="middle">单电源负载</text><path d="M644 779H665V813H688" class="line"/><path d="M644 847H665V813H688" class="line"/><path d="M774 813L808 813" class="line"/><text x="514" y="912" class="note" text-anchor="start">PMM负责配电监测/管理，不产生能量。</text><text x="514" y="940" class="note" text-anchor="start">检查：STS条件及其下游共用点。</text><text x="28" y="1036" class="note" text-anchor="start">课程功能简图 · 原书第75—82页 · 未表示全部保护、隔离、备用源及控制连接</text></svg>
