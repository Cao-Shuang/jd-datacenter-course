<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-label="布线空间：从外部入口走到设备端"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#356b65"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172e38;font-size:18px}.small{font-size:15px;fill:#4e6670}.box{fill:#fff;stroke:#a9c5c0;stroke-width:2}.line{fill:none;stroke:#356b65;stroke-width:2.5;marker-end:url(#a)}.thin{fill:none;stroke:#87a79f;stroke-width:2}.warm{fill:#fff0d9;stroke:#caa970;stroke-width:2}</style><rect width="1000" height="510" rx="20" fill="#f3f7f5"/><text x="34" y="42" font-size="25" font-weight="700">布线空间：从外部入口走到设备端</text><rect x="30" y="90" width="170" height="59" rx="10" class="box"/><text x="115.0" y="120" text-anchor="middle">运营商 / 进线间</text><rect x="270" y="90" width="170" height="84" rx="10" class="box"/><text x="355.0" y="120" text-anchor="middle">MDA</text><text x="355.0" y="145" text-anchor="middle">中心配线</text><rect x="510" y="90" width="170" height="84" rx="10" class="box"/><text x="595.0" y="120" text-anchor="middle">IDA（可选）</text><text x="595.0" y="145" text-anchor="middle">大型项目中继</text><rect x="750" y="90" width="210" height="84" rx="10" class="box"/><text x="855.0" y="120" text-anchor="middle">HDA</text><text x="855.0" y="145" text-anchor="middle">水平交叉连接</text><path class="line" d="M200,120 H270"/><path class="line" d="M440,120 H510"/><path class="line" d="M680,120 H750"/><rect x="750" y="270" width="210" height="84" rx="10" class="box"/><text x="855.0" y="300" text-anchor="middle">ZDA（可选）</text><text x="855.0" y="325" text-anchor="middle">无有源设备</text><rect x="440" y="270" width="210" height="84" rx="10" class="box"/><text x="545.0" y="300" text-anchor="middle">EDA</text><text x="545.0" y="325" text-anchor="middle">服务器 / 存储</text><rect x="30" y="270" width="280" height="84" rx="10" class="box"/><text x="170.0" y="300" text-anchor="middle">管理 / 辅助 / 支持区</text><text x="170.0" y="325" text-anchor="middle">经电信间接入</text><path class="line" d="M855,174 V270"/><path class="line" d="M750,310 H650"/><path class="line" d="M355,174 V310 H310"/><text x="38" y="435">读图：区域有职责，连接有长度与损耗；可选区域不能机械堆叠。</text><text x="34" y="486" class="small">依据图 7-8、7-13、7-17 归纳；省略交叉连接细节与冗余路径，非唯一布局。</text></svg>