<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title"><title id="title">后备发电：容量之外，还有四条依赖链</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect width="1000" height="520" rx="18" fill="#101c2b"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#e5edf7;font-size:20px}.small{font-size:17px;fill:#a9bdd3}.title{font-size:26px;font-weight:600}.line{fill:none;stroke-width:3;marker-end:url(#arrow)}.cold{stroke:#62c4e8}.hot{stroke:#efa277}.note{fill:#b7c8d9;font-size:18px}</style><text class="title" x="38" y="48">后备发电：容量之外，还有四条依赖链</text><rect x="40" y="190" width="170" height="85" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="58" y="223" class="">储油 / 日用油箱</text><text x="58" y="252" class="small">可用质量与数量</text><rect x="290" y="190" width="180" height="85" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="308" y="223" class="">柴油发动机</text><text x="308" y="252" class="small">化学能 → 机械能</text><rect x="550" y="190" width="180" height="85" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="568" y="223" class="">发电机</text><text x="568" y="252" class="small">机械能 → 电能</text><rect x="810" y="190" width="150" height="85" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="828" y="223" class="">关键负荷</text><text x="828" y="252" class="small">IT + 必要制冷</text><path d="M215 230 L285 230" class="line" stroke="#d1bb79"/><path d="M475 230 L545 230" class="line" stroke="#d1bb79"/><path d="M735 230 L805 230" class="line" stroke="#62c4e8"/><rect x="300" y="80" width="420" height="72" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="318" y="113" class="">空气与排热</text><text x="318" y="142" class="small">燃烧空气、设备散热、排烟与阻力</text><path d="M500 155 L500 185" class="line" stroke="#efa277"/><rect x="55" y="360" width="390" height="85" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="73" y="393" class="">启动与辅助电源</text><text x="73" y="422" class="small">电池、充电、加热、泵与控制</text><rect x="555" y="360" width="390" height="85" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="573" y="393" class="">切换 / 保护 / 并机控制</text><text x="573" y="422" class="small">状态反馈、故障隔离与带载证据</text><path d="M250 355 L250 305 L360 305 L360 280" class="line" stroke="#9ad6b0" stroke-dasharray="8 6"/><path d="M740 355 L740 315 L640 315 L640 280" class="line" stroke="#9ad6b0" stroke-dasharray="8 6"/><text x="40" y="495" class="note">N+1 机组不能自动保护公共供油、风路、母线或控制电源。</text></svg>