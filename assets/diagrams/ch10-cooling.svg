<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-label="京东案例：热量路径与连续性依赖"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#356b65"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172e38;font-size:18px}.small{font-size:15px;fill:#4e6670}.box{fill:#fff;stroke:#a9c5c0;stroke-width:2}.line{fill:none;stroke:#356b65;stroke-width:2.5;marker-end:url(#a)}.thin{fill:none;stroke:#87a79f;stroke-width:2}.warm{fill:#fff0d9;stroke:#caa970;stroke-width:2}</style><rect width="1000" height="510" rx="20" fill="#f3f7f5"/><text x="34" y="42" font-size="25" font-weight="700">京东案例：热量路径与连续性依赖</text><rect x="25" y="105" width="160" height="84" rx="10" class="box"/><text x="105.0" y="135" text-anchor="middle">IT设备</text><text x="105.0" y="160" text-anchor="middle">产生热量</text><rect x="225" y="105" width="160" height="84" rx="10" class="box"/><text x="305.0" y="135" text-anchor="middle">精密空调</text><text x="305.0" y="160" text-anchor="middle">空气↔冷冻水</text><rect x="425" y="105" width="160" height="84" rx="10" class="box"/><text x="505.0" y="135" text-anchor="middle">冷冻水环路</text><text x="505.0" y="160" text-anchor="middle">两级环路与分段</text><rect x="625" y="105" width="160" height="84" rx="10" class="box"/><text x="705.0" y="135" text-anchor="middle">冷水机组 / 板换</text><text x="705.0" y="160" text-anchor="middle">按工况选择路径</text><rect x="825" y="105" width="160" height="84" rx="10" class="box"/><text x="905.0" y="135" text-anchor="middle">冷却侧 / 冷却塔</text><text x="905.0" y="160" text-anchor="middle">向环境排热</text><path class="line" d="M185,145 H225"/><path class="line" d="M385,145 H425"/><path class="line" d="M585,145 H625"/><path class="line" d="M785,145 H825"/><rect x="35" y="300" width="280" height="84" rx="10" class="box"/><text x="175.0" y="330" text-anchor="middle">蓄冷：时间缓冲</text><text x="175.0" y="355" text-anchor="middle">负荷×时间决定所需能量</text><rect x="360" y="300" width="280" height="84" rx="10" class="box"/><text x="500.0" y="330" text-anchor="middle">冷冻泵与末端供电</text><text x="500.0" y="355" text-anchor="middle">有储冷也必须能输送</text><rect x="685" y="300" width="280" height="84" rx="10" class="box"/><text x="825.0" y="330" text-anchor="middle">冷源控制与监测</text><text x="825.0" y="355" text-anchor="middle">记录工况及故障状态</text><path class="thin" d="M175,300 V240 H505 V189"/><path class="thin" d="M500,300 V240"/><path class="thin" d="M825,300 V240 H705 V189"/><text x="40" y="435">真实案例：四台2461 kW、3+1；两级环路；在线蓄冷；板式换热器自然冷却。</text><text x="34" y="486" class="small">依据图10-27、10-32、10-33及正文重绘。箭头表示热量传递方向，不是水流或操作顺序。</text></svg>