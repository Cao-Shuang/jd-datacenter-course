<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-label="京东案例：沿供电路径追到负载"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#356b65"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172e38;font-size:18px}.small{font-size:15px;fill:#4e6670}.box{fill:#fff;stroke:#a9c5c0;stroke-width:2}.line{fill:none;stroke:#356b65;stroke-width:2.5;marker-end:url(#a)}.thin{fill:none;stroke:#87a79f;stroke-width:2}.warm{fill:#fff0d9;stroke:#caa970;stroke-width:2}</style><rect width="1000" height="900" rx="20" fill="#f3f7f5"/><text x="34" y="42" font-size="25" font-weight="700">京东案例：沿供电路径追到负载</text><rect x="55" y="85" width="310" height="84" rx="10" class="box"/><text x="210.0" y="115" text-anchor="middle">上级独立电源 A</text><text x="210.0" y="140" text-anchor="middle">来自不同220 kV变电站</text><rect x="55" y="205" width="310" height="84" rx="10" class="box"/><text x="210.0" y="235" text-anchor="middle">110/10 kV用户变 A</text><text x="210.0" y="260" text-anchor="middle">书中：每台63 MVA</text><rect x="55" y="345" width="310" height="84" rx="10" class="box"/><text x="210.0" y="375" text-anchor="middle">模块10 kV系统 A</text><text x="210.0" y="400" text-anchor="middle">另有相应柴油后备接入</text><rect x="55" y="475" width="310" height="84" rx="10" class="box"/><text x="210.0" y="505" text-anchor="middle">10/0.4 kV主用变配电 A</text><text x="210.0" y="530" text-anchor="middle">IT与辅助负荷分别供电</text><rect x="55" y="605" width="310" height="84" rx="10" class="box"/><text x="210.0" y="635" text-anchor="middle">UPS → 输出柜 → 列头柜 A</text><text x="210.0" y="660" text-anchor="middle">分离路径到相应负载</text><path class="line" d="M210,169 V205"/><path class="line" d="M210,289 V345"/><path class="line" d="M210,429 V475"/><path class="line" d="M210,559 V605"/><rect x="635" y="85" width="310" height="84" rx="10" class="box"/><text x="790.0" y="115" text-anchor="middle">上级独立电源 B</text><text x="790.0" y="140" text-anchor="middle">来自不同220 kV变电站</text><rect x="635" y="205" width="310" height="84" rx="10" class="box"/><text x="790.0" y="235" text-anchor="middle">110/10 kV用户变 B</text><text x="790.0" y="260" text-anchor="middle">书中：每台63 MVA</text><rect x="635" y="345" width="310" height="84" rx="10" class="box"/><text x="790.0" y="375" text-anchor="middle">模块10 kV系统 B</text><text x="790.0" y="400" text-anchor="middle">另有相应柴油后备接入</text><rect x="635" y="475" width="310" height="84" rx="10" class="box"/><text x="790.0" y="505" text-anchor="middle">10/0.4 kV主用变配电 B</text><text x="790.0" y="530" text-anchor="middle">IT与辅助负荷分别供电</text><rect x="635" y="605" width="310" height="84" rx="10" class="box"/><text x="790.0" y="635" text-anchor="middle">UPS → 输出柜 → 列头柜 B</text><text x="790.0" y="660" text-anchor="middle">分离路径到相应负载</text><path class="line" d="M790,169 V205"/><path class="line" d="M790,289 V345"/><path class="line" d="M790,429 V475"/><path class="line" d="M790,559 V605"/><rect x="370" y="745" width="260" height="84" rx="10" class="box"/><text x="500.0" y="775" text-anchor="middle">IT机柜</text><text x="500.0" y="800" text-anchor="middle">按区域分别采用2N或N+1</text><path class="line" d="M210,689 V787 H370"/><path class="line" d="M790,689 V787 H630"/><text x="403" y="240">母线联络存在</text><text x="403" y="269" class="small">状态受设计与控制约束</text><path class="thin" stroke-dasharray="7 6" d="M365,250 H635"/><text x="384" y="405">燃油、通风、控制</text><text x="384" y="433">也是后备电源依赖</text><text x="384" y="535">计划维护另有</text><text x="384" y="563">备用供电安排</text><text x="34" y="876" class="small">依据图10-4、10-6、10-16、10-19归纳；省略开关及控制细节，不作操作图。</text></svg>