<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-label="装修是一套会影响气流与风险的边界"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#356b65"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172e38;font-size:18px}.small{font-size:15px;fill:#4e6670}.box{fill:#fff;stroke:#a9c5c0;stroke-width:2}.line{fill:none;stroke:#356b65;stroke-width:2.5;marker-end:url(#a)}.thin{fill:none;stroke:#87a79f;stroke-width:2}.warm{fill:#fff0d9;stroke:#caa970;stroke-width:2}</style><rect width="1000" height="530" rx="20" fill="#f3f7f5"/><text x="34" y="42" font-size="25" font-weight="700">装修是一套会影响气流与风险的边界</text><rect x="215" y="100" width="570" height="310" fill="#fff" stroke="#356b65" stroke-width="8"/><path d="M215 330 H785" stroke="#97b9b1" stroke-width="10"/><path d="M260 350 H740" class="line"/><path d="M330 330 V245" class="line"/><path d="M655 330 V245" class="line"/><rect x="295" y="180" width="150" height="84" rx="10" class="box"/><text x="370.0" y="210" text-anchor="middle">机柜</text><text x="370.0" y="235" text-anchor="middle">气流与承载</text><rect x="555" y="180" width="150" height="84" rx="10" class="box"/><text x="630.0" y="210" text-anchor="middle">机柜</text><text x="630.0" y="235" text-anchor="middle">材料与静电</text><text x="410" y="135">顶部：防尘 / 保温 / 管线维护</text><text x="360" y="385">地板下：送风、线缆、监测与清洁</text><text x="230" y="450">四面墙 + 顶面 + 地面：每次开洞与变更都要恢复功能边界</text><rect x="25" y="185" width="165" height="84" rx="10" class="box"/><text x="107.5" y="215" text-anchor="middle">外部温湿度</text><text x="107.5" y="240" text-anchor="middle">凝露与传热</text><rect x="810" y="185" width="165" height="84" rx="10" class="box"/><text x="892.5" y="215" text-anchor="middle">邻接空间</text><text x="892.5" y="240" text-anchor="middle">水 / 火 / 尘</text><path class="line" d="M190,220 H215"/><path class="line" d="M810,220 H785"/><text x="34" y="506" class="small">课程剖面示意，不表示实际尺寸；需同时审查隐蔽空间、接口及维护状态。</text></svg>