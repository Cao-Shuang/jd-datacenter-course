<svg xmlns="http://www.w3.org/2000/svg" width="960" height="750" viewBox="0 0 960 750" role="img" aria-label="UPS四种工作状态的能量路径"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#386454"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#233f35}.title{font-size:26px;font-weight:700}.label{font-size:19px;font-weight:600}.small{font-size:16px}.note{font-size:15px;fill:#52685e}.box{fill:#fff;stroke:#6b8c7c;stroke-width:1.5}.line{fill:none;stroke:#386454;stroke-width:2.5;marker-end:url(#a)}</style><rect width="100%" height="100%" fill="#f4f7f5"/><text x="32" y="42" class="title" text-anchor="start">四种状态，四个保障边界</text><text x="32" y="72" class="note" text-anchor="start">沿绿色箭头追踪当前能量；旁路并不自动保留双变换与电池保护。</text><text x="32" y="126" class="label" text-anchor="start">正常</text><rect x="32" y="144" width="194" height="52" rx="8" class="box"/><text x="129" y="176" class="small" text-anchor="middle">主路交流</text><path d="M226 170L259 170" class="line"/><rect x="264" y="144" width="194" height="52" rx="8" class="box"/><text x="361" y="176" class="small" text-anchor="middle">整流 / 直流母线</text><path d="M458 170L491 170" class="line"/><rect x="496" y="144" width="194" height="52" rx="8" class="box"/><text x="593" y="176" class="small" text-anchor="middle">逆变器</text><path d="M690 170L723 170" class="line"/><rect x="728" y="144" width="194" height="52" rx="8" class="box"/><text x="825" y="176" class="small" text-anchor="middle">交流负载</text><text x="32" y="226" class="note" text-anchor="start">电池处于后备/充电条件；当前输出由主路能量经双变换提供。</text><text x="32" y="281" class="label" text-anchor="start">电池后备</text><rect x="32" y="299" width="194" height="52" rx="8" class="box"/><text x="129" y="331" class="small" text-anchor="middle">电池储能</text><path d="M226 325L259 325" class="line"/><rect x="264" y="299" width="194" height="52" rx="8" class="box"/><text x="361" y="331" class="small" text-anchor="middle">直流母线 / 斩波</text><path d="M458 325L491 325" class="line"/><rect x="496" y="299" width="194" height="52" rx="8" class="box"/><text x="593" y="331" class="small" text-anchor="middle">逆变器</text><path d="M690 325L723 325" class="line"/><rect x="728" y="299" width="194" height="52" rx="8" class="box"/><text x="825" y="331" class="small" text-anchor="middle">交流负载</text><text x="32" y="381" class="note" text-anchor="start">续航取决于可交付功率、截止电压、温度与老化，不只看Ah。</text><text x="32" y="436" class="label" text-anchor="start">静态旁路</text><rect x="32" y="454" width="194" height="52" rx="8" class="box" style="fill:#fff0df"/><text x="129" y="486" class="small" text-anchor="middle">旁路交流</text><path d="M226 480L259 480" class="line"/><rect x="264" y="454" width="194" height="52" rx="8" class="box"/><text x="361" y="486" class="small" text-anchor="middle">静态开关</text><path d="M458 480L491 480" class="line"/><rect x="496" y="454" width="194" height="52" rx="8" class="box"/><text x="593" y="486" class="small" text-anchor="middle">输出母线</text><path d="M690 480L723 480" class="line"/><rect x="728" y="454" width="194" height="52" rx="8" class="box"/><text x="825" y="486" class="small" text-anchor="middle">交流负载</text><text x="32" y="536" class="note" text-anchor="start">转移要核验电压与同步等条件；当前负载直接接受旁路电源。</text><text x="32" y="591" class="label" text-anchor="start">维修旁路</text><rect x="32" y="609" width="194" height="52" rx="8" class="box" style="fill:#fff0df"/><text x="129" y="641" class="small" text-anchor="middle">旁路交流</text><path d="M226 635L259 635" class="line"/><rect x="264" y="609" width="194" height="52" rx="8" class="box"/><text x="361" y="641" class="small" text-anchor="middle">维修通路</text><path d="M458 635L491 635" class="line"/><rect x="496" y="609" width="194" height="52" rx="8" class="box"/><text x="593" y="641" class="small" text-anchor="middle">输出母线</text><path d="M690 635L723 635" class="line"/><rect x="728" y="609" width="194" height="52" rx="8" class="box"/><text x="825" y="641" class="small" text-anchor="middle">交流负载</text><text x="32" y="691" class="note" text-anchor="start">核心可在合格隔离方案下退出；负载有电不等于仍受UPS保护。</text><text x="32" y="735" class="note" text-anchor="start">课程功能图 · 依据原书第59—61页重绘 · 省略保护、隔离及实际接线细节</text></svg>
