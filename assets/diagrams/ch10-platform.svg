<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="京东案例：监控层级连接四类管理工作"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#356b65"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#172e38;font-size:18px}.small{font-size:15px;fill:#4e6670}.box{fill:#fff;stroke:#a9c5c0;stroke-width:2}.line{fill:none;stroke:#356b65;stroke-width:2.5;marker-end:url(#a)}.thin{fill:none;stroke:#87a79f;stroke-width:2}.warm{fill:#fff0d9;stroke:#caa970;stroke-width:2}</style><rect width="1000" height="520" rx="20" fill="#f3f7f5"/><text x="34" y="42" font-size="25" font-weight="700">京东案例：监控层级连接四类管理工作</text><rect x="45" y="100" width="220" height="84" rx="10" class="box"/><text x="155.0" y="130" text-anchor="middle">设备 / 传感器</text><text x="155.0" y="155" text-anchor="middle">对象ID与时间戳</text><rect x="390" y="100" width="220" height="84" rx="10" class="box"/><text x="500.0" y="130" text-anchor="middle">模块监控</text><text x="500.0" y="155" text-anchor="middle">采集→监控→集中</text><rect x="735" y="100" width="220" height="84" rx="10" class="box"/><text x="845.0" y="130" text-anchor="middle">园区ECC</text><text x="845.0" y="155" text-anchor="middle">资源与业务全景</text><path class="line" d="M265,140 H390"/><path class="line" d="M610,140 H735"/><rect x="30" y="300" width="190" height="84" rx="10" class="box"/><text x="125.0" y="330" text-anchor="middle">基础设施</text><text x="125.0" y="355" text-anchor="middle">资产 / 故障 / 容量</text><rect x="280" y="300" width="190" height="84" rx="10" class="box"/><text x="375.0" y="330" text-anchor="middle">客户服务</text><text x="375.0" y="355" text-anchor="middle">受理 / 分派 / 跟进</text><rect x="530" y="300" width="190" height="84" rx="10" class="box"/><text x="625.0" y="330" text-anchor="middle">客户自助</text><text x="625.0" y="355" text-anchor="middle">申请 / 查询 / 授权</text><rect x="780" y="300" width="190" height="84" rx="1