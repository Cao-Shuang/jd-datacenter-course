<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title"><title id="title">气流：有效穿过服务器，才带走热量</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect width="1000" height="520" rx="18" fill="#101c2b"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#e5edf7;font-size:20px}.small{font-size:17px;fill:#a9bdd3}.title{font-size:26px;font-weight:600}.line{fill:none;stroke-width:3;marker-end:url(#arrow)}.cold{stroke:#62c4e8}.hot{stroke:#efa277}.note{fill:#b7c8d9;font-size:18px}</style><text class="title" x="38" y="48">气流：有效穿过服务器，才带走热量</text><rect x="45" y="170" width="190" height="110" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="63" y="203" class="">空调末端</text><text x="63" y="232" class="small">冷却回风</text><rect x="320" y="170" width="180" height="110" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="338" y="203" class="">冷通道</text><text x="338" y="232" class="small">设备进风</text><rect x="585" y="170" width="150" height="110" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="603" y="203" class="">服务器</text><text x="603" y="232" class="small">吸收 IT 热</text><rect x="815" y="170" width="145" height="110" rx="10" fill="#182b40" stroke="#efa277" stroke-width="2"/><text x="833" y="203" class="">热通道</text><text x="833" y="232" class="small">设备排风</text><path d="M240 220 L315 220" class="line" stroke="#62c4e8"/><path d="M505 220 L580 220" class="line" stroke="#62c4e8"/><path d="M740 220 L810 220" class="line" stroke="#efa277"/><path d="M880 285 L880 385 L140 385 L140 285" class="line" stroke="#efa277"/><path d="M400 165 L400 110 L145 110 L145 165" class="line" stroke="#d1bb79" stroke-dasharray="8 6"/><text x="200" y="88" class="small">冷空气旁路：未经过服务器</text><path d="M890 165 L890 100 L490 100 L490 165" class="line" stroke="#efa277" stroke-dasharray="8 6"/><text x="610" y="80" class="small">热回流：抬高进风温度</text><text x="250" y="350" class="note">有效空气质量流量 × 比热 × 温升 = 机柜显热功率</text><text x="40" y="470" class="note">封闭与合理布风减少混合；增加总风量不能自动修复错误路径。</text></svg>