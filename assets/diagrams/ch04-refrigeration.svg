<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title"><title id="title">制冷循环：热量搬运，不是热量消失</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="context-stroke"/></marker></defs><rect width="1000" height="520" rx="18" fill="#101c2b"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#e5edf7;font-size:20px}.small{font-size:17px;fill:#a9bdd3}.title{font-size:26px;font-weight:600}.line{fill:none;stroke-width:3;marker-end:url(#arrow)}.cold{stroke:#62c4e8}.hot{stroke:#efa277}.note{fill:#b7c8d9;font-size:18px}</style><text class="title" x="38" y="48">制冷循环：热量搬运，不是热量消失</text><rect x="70" y="200" width="180" height="90" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="88" y="233" class="">蒸发器</text><text x="88" y="262" class="small">低压侧吸热</text><rect x="390" y="100" width="220" height="90" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="408" y="133" class="">压缩机</text><text x="408" y="162" class="small">输入机械功 W</text><rect x="750" y="200" width="180" height="90" rx="10" fill="#182b40" stroke="#efa277" stroke-width="2"/><text x="768" y="233" class="">冷凝器</text><text x="768" y="262" class="small">高压侧放热</text><rect x="390" y="350" width="220" height="90" rx="10" fill="#182b40" stroke="#62c4e8" stroke-width="2"/><text x="408" y="383" class="">节流装置</text><text x="408" y="412" class="small">降压进入低温侧</text><path d="M250 225 L315 225 L315 145 L385 145" class="line" stroke="#62c4e8"/><path d="M610 145 L680 145 L680 225 L745 225" class="line" stroke="#efa277"/><path d="M840 295 L840 395 L615 395" class="line" stroke="#efa277"/><path d="M385 395 L160 395 L160 295" class="line" stroke="#62c4e8"/><text x="332" y="270" class="">Q凝 = Q蒸 + W</text><text x="360" y="305" class="">COP = Q蒸 / W</text><text x="65" y="165" class="">来自房间的热 Q蒸</text><text x="720" y="165" class="">排到室外的热 Q凝</text><text x="40" y="493" class="note">稳态教学模型忽略其他散热；COP 大于 1 仍符合能量守恒。</text></svg>