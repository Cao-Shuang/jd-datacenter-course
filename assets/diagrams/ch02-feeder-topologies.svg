<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d"><title id="t">三种馈线拓扑</title><desc id="d">放射式各负载从源独立分支，树干式多个负载共享干线，环网两端有源并设运行开点。</desc><rect width="960" height="600" rx="18" fill="#f5f4ef"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203c36"><text x="30" y="40" font-size="25" font-weight="700">路径如何共享，故障就如何传播</text><g stroke="#497568" stroke-width="3" fill="none"><path d="M160 155H250V105H430M250 155H430M250 155V205H430"/><path d="M160 335H780M330 335V380M550 335V380M770 335V380"/><path d="M160 495H385M430 495H780M300 495V540M650 495V540"/></g><g fill="#e3ede6" stroke="#497568" stroke-width="2"><rect x="30" y="125" width="130" height="60" rx="8"/><rect x="430" y="80" width="150" height="48" rx="8"/><rect x="430" y="132" width="150" height="48" rx="8"/><rect x="430" y="184" width="150" height="48" rx="8"/><rect x="30" y="305" width="130" height="60" rx="8"/><rect x="260" y="380" width="140" height="45" rx="8"/><rect x="480" y="380" width="140" height="45" rx="8"/><rect x="700" y="380" width="140" height="45" rx="8"/><rect x="30" y="465" width="130" height="60" rx="8"/><rect x="780" y="465" width="150" height="60" rx="8"/><rect x="230" y="540" width="140" height="45" rx="8"/><rect x="580" y="540" width="140" height="45" rx="8"/></g><g font-size="20" text-anchor="middle"><text x="95" y="163">源 / 母线</text><text x="505" y="112">负载 A</text><text x="505" y="164">负载 B</text><text x="505" y="216">负载 C</text><text x="95" y="343">源 / 母线</text><text x="330" y="410">负载 A</text><text x="550" y="410">负载 B</text><text x="770" y="410">负载 C</text><text x="95" y="503">源 1</text><text x="855" y="503">源 2</text><text x="300" y="570">负载 A</text><text x="650" y="570">负载 B</text></g><g font-size="19"><text x="620" y="115" font-weight="700">放射式</text><text x="620" y="149">各支路退出影响局部</text><text x="620" y="179">共同源仍需审查</text><text x="30" y="280" font-weight="700">树干式 · 上游公共段故障可能影响多个负载</text><text x="30" y="455" font-weight="700">环式 · 画成环，不等于全部闭合运行</text><text x="355" y="480" fill="#a76d36">运行开点</text></g><path d="M385 495L422 474" stroke="#a76d36" stroke-width="4"/></g></svg>
